<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngageSense: The Black Box of Audience Engagement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #00ff00;
            --primary-dark: #00cc00;
            --background: #000000;
            --text: #ffffff;
            --accent: #1a1a1a;
            --glow: rgba(0, 255, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
        }

        body {
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 1rem 2rem;
            background-color: rgba(0, 0, 0, 0.9);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0px 4px 10px var(--glow);
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(to bottom, transparent, var(--accent));
            padding: 2rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            text-shadow: 0 0 15px var(--glow);
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--glow); }
            to { text-shadow: 0 0 25px var(--primary); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--primary);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .feature-card {
            background: var(--accent);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--primary);
            transition: transform 0.3s ease, box-shadow 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--glow);
        }

        .chart-container {
            max-width: 800px;
            margin: 2rem auto;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid var(--primary);
        }

    </style>
</head>
<body>
    <nav>
        <a href="#intro">Core System</a>
        <a href="#demo">Interactive Demo</a>
        <a href="#cpe">CPE Formula</a>
        <a href="#technical">Technical Features</a>
    </nav>

    <section class="hero">
        <div class="container">
            <h1>EngageSense</h1>
            <p>The Black Box of Audience Engagement</p>
        </div>
    </section>

    <div class="container">
        <section id="cpe">
            <h2 class="section-title">CPE Formula and Real-Time Analytics</h2>
            <div class="chart-container">
                <canvas id="engagementChart"></canvas>
            </div>
        </section>

        <section id="demo">
            <h2 class="section-title">Interactive EngageSense Demo</h2>
            <iframe src="https://darling-zabaione-a5e03c.netlify.app/" title="EngageSense Interactive Demo"></iframe>
        </section>
    </div>

    <script>
        // Engagement Analytics Chart
        const ctx = document.getElementById('engagementChart').getContext('2d');
        const engagementChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10s', '20s', '30s', '40s', '50s', '60s'],
                datasets: [{
                    label: 'Engagement Level',
                    data: [12, 19, 7, 14, 22, 30],
                    borderColor: '#00ff00',
                    backgroundColor: 'rgba(0, 255, 0, 0.2)',
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: {
                            color: 'white'
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: 'white' },
                        grid: { color: 'gray' }
                    },
                    y: {
                        ticks: { color: 'white' },
                        grid: { color: 'gray' }
                    }
                }
            }
        });
    </script>
</body>
</html>
